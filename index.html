
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PB Salon Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Poppins', sans-serif;
}

/* MAIN HOME PAGE */

.home {
    width: 100%;
    min-height: 100vh;
    position: relative;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.70),
            rgba(0,0,0,0.12),
            rgba(0,0,0,0.20)
        ),
        url("bridal-bg.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
}

/* NAVIGATION */

.navbar {
    width: 100%;
    padding: 35px 8%;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #e5c18e;
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    letter-spacing: 3px;
    line-height: 1;
}

.logo span {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 9px;
    letter-spacing: 5px;
    margin-top: 8px;
    color: #f5e6d0;
}

.nav-links {
    display: flex;
    gap: 35px;
    list-style: none;
}

.nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #e5c18e;
}

/* HERO CONTENT */

.hero-content {
    flex: 1;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 40px 10%;
    max-width: 850px;
}

.subtitle {
    color: #e5c18e;
    font-size: 11px;
    letter-spacing: 7px;
    margin-bottom: 25px;
}

.hero-content h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(60px, 8vw, 105px);
    line-height: 0.95;
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 20px;
}

.hero-content h1 span {
    color: #e5c18e;
    font-style: italic;
}

.description {
    color: #f4e8df;
    font-size: 13px;
    font-weight: 300;
    line-height: 2;
    max-width: 460px;
    margin-bottom: 35px;
}

/* BUTTON */

.button {
    display: inline-block;
    width: fit-content;

    padding: 16px 35px;

    border: 1px solid #d9b47e;

    color: #ffffff;
    text-decoration: none;

    font-size: 10px;
    letter-spacing: 3px;

    transition: 0.3s;
}

.button:hover {
    background: #b38b60;
    border-color: #b38b60;
}

/* BOTTOM TEXT */

.bottom-text {
    padding: 25px 8%;
    text-align: right;

    color: #e5c18e;
    font-size: 9px;
    letter-spacing: 4px;
}

/* MOBILE DESIGN */

@media(max-width: 768px) {

    .navbar {
        padding: 25px 6%;
        flex-direction: column;
        gap: 25px;
    }

    .nav-links {
        gap: 18px;
    }

    .nav-links a {
        font-size: 9px;
        letter-spacing: 1px;
    }

    .home {
        min-height: 100vh;
        background-position: 58% center;
    }

    .hero-content {
        padding: 60px 7%;
        justify-content: center;
    }

    .hero-content h1 {
        font-size: 58px;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: 4px;
    }

    .description {
        font-size: 12px;
    }

    .bottom-text {
        font-size: 8px;
    }
}

</style>
</head>

<body>

<section class="home">

    <!-- WEBSITE NAME AND NAVIGATION -->

    <nav class="navbar">

        <div class="logo">
            PB
            <span>SALON ACADEMY</span>
        </div>

        <ul class="nav-links">
            <li><a href="#home">HOME</a></li>
            <li><a href="services.html">SERVICES</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>

    </nav>

    <!-- MAIN INTRODUCTION -->

    <div class="hero-content" id="home">

        <div class="subtitle">
            BEAUTY • ELEGANCE • CONFIDENCE
        </div>

        <h1>
            The Art of
            <br>
            <span>Being Beautiful.</span>
        </h1>

        <p class="description">
            Welcome to PB Salon Academy.

            Where beauty meets artistry, elegance meets perfection
            and every woman discovers her own beautiful story.
        </p>

        <a href="services.html" class="button">
            DISCOVER MORE
        </a>

    </div>

    <div class="bottom-text">
        BEAUTY IS OUR PASSION
    </div>

</section>

</body>
</html>
